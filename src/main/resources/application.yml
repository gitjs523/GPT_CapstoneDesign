spring:
  application:
    name: Snow

  config:
    import: optional:file:.env[.properties]

  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_CHAT_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen3:4b-q4_K_M}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  sql:
    init:
      mode: never

ollama:
  chat:
    connect-timeout-seconds: ${OLLAMA_CHAT_CONNECT_TIMEOUT:5}
    read-timeout-seconds: ${OLLAMA_CHAT_READ_TIMEOUT:180}
  embedding:
    url: ${OLLAMA_EMBEDDING_URL:http://localhost:11434}
    model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}
    batch-size: ${OLLAMA_EMBEDDING_BATCH_SIZE:20}
    connect-timeout-seconds: ${OLLAMA_EMBEDDING_CONNECT_TIMEOUT:5}
    read-timeout-seconds: ${OLLAMA_EMBEDDING_READ_TIMEOUT:30}

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:snow}
    access-token-secret: ${AUTH_ACCESS_TOKEN_SECRET}
    access-token-expiration-seconds: ${AUTH_ACCESS_TOKEN_EXPIRATION_SECONDS:900}

  refresh-token:
    expiration-seconds: ${AUTH_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}
    cookie:
      name: ${AUTH_REFRESH_COOKIE_NAME:snow_refresh}
      secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
      same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
      path: ${AUTH_REFRESH_COOKIE_PATH:/api/auth}
      domain: ${AUTH_REFRESH_COOKIE_DOMAIN:}

cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET_NAME}

chunking:
  semantic:
    # 인접 블록 cosine 상대 깊이(mean - k*std) 경계 민감도. 클수록 덜 분할.
    k: ${CHUNKING_SEMANTIC_K:1.0}
    # Section 크기 상한(자). 초과 시 내부 최저 유사도 seam에서 분할(LLM context 토큰 예산 보호).
    max-section-chars: ${CHUNKING_SEMANTIC_MAX_SECTION_CHARS:4000}

model-queue:
  embedding-capacity: ${MODEL_QUEUE_EMBEDDING_CAPACITY:5}
  generation-capacity: ${MODEL_QUEUE_GENERATION_CAPACITY:10}

qa-job:
  retention-minutes: ${QA_JOB_RETENTION_MINUTES:30}
  cleanup-interval-ms: ${QA_JOB_CLEANUP_INTERVAL_MS:600000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500}

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
