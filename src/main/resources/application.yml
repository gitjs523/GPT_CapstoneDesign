spring:
  application:
    name: Snow

  config:
    import: optional:file:.env[.properties]

  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_CHAT_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen3:4b-q4_K_M}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 단일·저트래픽 인스턴스 — 커넥션 3개면 충분 (기본 10 → 메모리/RDS 슬롯 절약)
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}

  servlet:
    multipart:
      # 업로드 파일은 컨트롤러에서 getBytes()로 통째로 힙에 적재됨 → 상한을 보수적으로
      max-file-size: ${MAX_UPLOAD_SIZE:20MB}
      max-request-size: ${MAX_UPLOAD_SIZE:20MB}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  sql:
    init:
      mode: never

ollama:
  chat:
    connect-timeout-seconds: ${OLLAMA_CHAT_CONNECT_TIMEOUT:5}
    read-timeout-seconds: ${OLLAMA_CHAT_READ_TIMEOUT:180}
  embedding:
    url: ${OLLAMA_EMBEDDING_URL:http://localhost:11434}
    model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}
    batch-size: ${OLLAMA_EMBEDDING_BATCH_SIZE:20}
    connect-timeout-seconds: ${OLLAMA_EMBEDDING_CONNECT_TIMEOUT:5}
    read-timeout-seconds: ${OLLAMA_EMBEDDING_READ_TIMEOUT:120}
    max-attempts: ${OLLAMA_EMBEDDING_MAX_ATTEMPTS:3}
    retry-backoff-ms: ${OLLAMA_EMBEDDING_RETRY_BACKOFF_MS:1000}
  ocr:
    enabled: ${OLLAMA_OCR_ENABLED:true}
    url: ${OLLAMA_OCR_URL:http://localhost:11434}
    model: ${OLLAMA_OCR_MODEL:glm-ocr:latest}
    connect-timeout-seconds: ${OLLAMA_OCR_CONNECT_TIMEOUT:5}
    read-timeout-seconds: ${OLLAMA_OCR_READ_TIMEOUT:180}
    min-text-chars: ${OLLAMA_OCR_MIN_TEXT_CHARS:30}
    render-dpi: ${OLLAMA_OCR_RENDER_DPI:180}
    powerpoint-enabled: ${OLLAMA_OCR_POWERPOINT_ENABLED:false}
    prompt: "${OLLAMA_OCR_PROMPT:Text Recognition: Extract only visible text from this document image. Preserve line breaks. Do not explain, summarize, or infer missing text.}"
  vision:
    enabled: ${OLLAMA_VISION_ENABLED:true}
    url: ${OLLAMA_VISION_URL:${OLLAMA_CHAT_URL:http://localhost:11434}}
    model: ${OLLAMA_VISION_MODEL:qwen3-vl:4b}
    connect-timeout-seconds: ${OLLAMA_VISION_CONNECT_TIMEOUT:5}
    read-timeout-seconds: ${OLLAMA_VISION_READ_TIMEOUT:180}
    render-dpi: ${OLLAMA_VISION_RENDER_DPI:180}
    # 비전 트리거 모드: image(기본, 이미지 있는 페이지만) | always(모든 페이지)
    mode: ${OLLAMA_VISION_MODE:image}
    pdf-enabled: ${OLLAMA_VISION_PDF_ENABLED:true}
    powerpoint-enabled: ${OLLAMA_VISION_POWERPOINT_ENABLED:true}
    prompt: "${OLLAMA_VISION_PROMPT:이 이미지는 강의자료의 한 페이지 또는 슬라이드입니다. 이미지 안의 텍스트, 표, 도식, 화살표 관계를 바탕으로 퀴즈 생성에 도움이 되는 핵심 개념과 관계를 한국어 학습 문맥으로 설명하세요. 보이지 않는 내용은 추측하지 말고, 단순 OCR 원문 나열이 아니라 학습자가 이해할 수 있는 설명으로 정리하세요. 시각적으로 의미 있는 내용이 없으면 빈 문자열만 반환하세요.}"

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:snow}
    access-token-secret: ${AUTH_ACCESS_TOKEN_SECRET}
    access-token-expiration-seconds: ${AUTH_ACCESS_TOKEN_EXPIRATION_SECONDS:900}

  refresh-token:
    expiration-seconds: ${AUTH_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}
    cookie:
      name: ${AUTH_REFRESH_COOKIE_NAME:snow_refresh}
      secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
      same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
      path: ${AUTH_REFRESH_COOKIE_PATH:/api/auth}
      domain: ${AUTH_REFRESH_COOKIE_DOMAIN:}

cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET_NAME}

chunking:
  semantic:
    # 인접 블록 cosine 상대 깊이(mean - k*std) 경계 민감도. 클수록 덜 분할.
    k: ${CHUNKING_SEMANTIC_K:1.0}
    # Section 크기 상한(자). 초과 시 내부 최저 유사도 seam에서 분할(LLM context 토큰 예산 보호).
    max-section-chars: ${CHUNKING_SEMANTIC_MAX_SECTION_CHARS:4000}

model-queue:
  embedding-capacity: ${MODEL_QUEUE_EMBEDDING_CAPACITY:5}
  generation-capacity: ${MODEL_QUEUE_GENERATION_CAPACITY:10}

qa-job:
  retention-minutes: ${QA_JOB_RETENTION_MINUTES:30}
  cleanup-interval-ms: ${QA_JOB_CLEANUP_INTERVAL_MS:600000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500}

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: framework
  tomcat:
    threads:
      # 저트래픽 — 기본 200스레드는 과다(스택 메모리). 25면 충분
      max: ${TOMCAT_MAX_THREADS:25}
      min-spare: 5
