<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SNOW workspace for document-based question generation.">
  <title>SNOW Workspace</title>
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
  <nav class="global-nav" aria-label="Global">
    <div class="nav-brand-group">
      <a class="nav-brand" href="./index.html">SNOW</a>
      <span class="nav-tagline">
        <strong>S</strong>mart <strong>N</strong>ote <strong>O</strong>rganizer for <strong>W</strong>eb
      </span>
    </div>
    <div class="nav-links">
      <a href="./explanation.html">Q&A</a>
      <a id="login-link" href="./login.html">Login</a>
      <button type="button" id="logout-button" class="nav-button" hidden>Logout</button>
    </div>
  </nav>

  <div class="screen-layout app-surface">
    <aside class="screen-side screen-side-left">
      <div class="left-layout">
        <div class="left-rail">
          <button type="button" id="left-menu-toggle" class="left-menu-toggle" aria-expanded="false" aria-controls="left-menu-drawer">
            <span class="sr-only">Menu</span>
            <strong aria-hidden="true">&#9776;</strong>
          </button>
        </div>

        <div id="left-menu-drawer" class="left-menu-drawer" aria-hidden="true">
          <div class="left-history-slot">
            <section class="panel notebook-panel">
              <div class="panel-heading">
                <h2>Notebook</h2>
              </div>
              <div class="notebook-actions">
                <button type="button" id="notebook-new" class="ghost-button">&#49352; Notebook</button>
                <button type="button" id="notebook-save" class="primary-button">&#51200;&#51109;</button>
              </div>
              <label class="select-wrap notebook-select-wrap">
                <span>&#51200;&#51109;&#46108; Notebook</span>
                <select id="notebook-select"></select>
              </label>
              <button type="button" id="notebook-load" class="ghost-button notebook-load">&#48520;&#47084;&#50724;&#44592;</button>
              <button type="button" id="notebook-delete" class="ghost-button notebook-delete">&#49325;&#51228;</button>
              <p id="notebook-status" class="notebook-status" aria-live="polite">Notebook을 저장하거나 불러올 수 있습니다.</p>
            </section>

            <section class="panel document-upload-panel uploaded-files-panel">
              <div class="panel-heading">
                <h2 class="document-upload-title">
                  <span>&#47928;&#49436; &#50629;&#47196;&#46300;</span>
                  <label class="clip-upload-button title-clip-upload-button" for="document-upload" aria-label="Choose file">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path d="M21.4 11.6 12.1 20.9a6 6 0 0 1-8.5-8.5l9.8-9.8a4 4 0 0 1 5.7 5.7l-9.8 9.8a2 2 0 1 1-2.8-2.8l9.3-9.3"></path>
                    </svg>
                  </label>
                </h2>
              </div>
              <div class="upload-status-group">
                <label class="upload-dropzone compact-upload inline-uploader" for="document-upload">
                  <input id="document-upload" type="file" accept=".pdf,.ppt,.pptx" multiple>
                  <strong>&#54028;&#51068;&#51012; &#46300;&#47000;&#44536;&#54644;&#49436; &#50629;&#47196;&#46300;&#54616;&#49464;&#50836;.</strong>
                  <span id="selected-file-name">PDF, PPT, PPTX &#50668;&#47084; &#44060; &#50629;&#47196;&#46300;</span>
                </label>
                <label class="add-document-button" for="document-upload">&#47928;&#49436; &#52628;&#44032;</label>
              </div>
              <div class="uploaded-files-header merged-uploaded-files-header">
                <h3>&#47928;&#49436; &#47785;&#47197;</h3>
              </div>
              <div id="uploaded-files-list" class="uploaded-files-list">
                <p class="uploaded-file-empty">&#50500;&#51649; &#50629;&#47196;&#46300;&#46108; &#47928;&#49436;&#44032; &#50630;&#49845;&#45768;&#45796;.</p>
              </div>
            </section>

            <aside class="panel history-panel">
              <div class="panel-heading">
                <h2>&#50836;&#52397; &#44592;&#47197;</h2>
              </div>
              <p class="history-caption">&#51060;&#51204;&#50640; &#49892;&#54665;&#54620; &#50836;&#52397;&#51012; &#48736;&#47476;&#44172; &#54869;&#51064;&#54624; &#49688; &#51080;&#49845;&#45768;&#45796;.</p>
              <div id="history-list" class="history-list">
                <p class="history-empty">&#50500;&#51649; &#51200;&#51109;&#46108; &#50836;&#52397; &#44592;&#47197;&#51060; &#50630;&#49845;&#45768;&#45796;.</p>
              </div>
            </aside>
            <section class="panel quiz-jobs-panel">
              <div class="panel-heading panel-row">
                <div>
                  <h2>퀴즈 생성 기록</h2>
                </div>
                <button type="button" id="quiz-jobs-refresh" class="icon-button refresh-icon-button" aria-label="퀴즈 생성 기록 새로고침" title="새로고침">&#8635;</button>
              </div>
              <div id="quiz-jobs-list" class="quiz-jobs-list">
                <p class="history-empty">Notebook을 선택하면 퀴즈 생성 기록이 표시됩니다.</p>
              </div>
            </section>
            <button type="button" id="withdraw-button" class="withdraw-button" hidden>회원 탈퇴</button>
          </div>
        </div>
      </div>
    </aside>

    <div class="page-shell">
      <header class="hero product-hero">
        <div class="hero-copy">
          <p id="welcome-message" class="hero-description welcome-message" hidden></p>
        </div>
        <div class="hero-subtitle-row">
          <p id="hero-status-text" class="hero-subtitle hero-title" contenteditable="true" spellcheck="false" dir="ltr" aria-label="Project title"></p>
          <button type="button" id="hero-edit-title" class="hero-edit-button" aria-label="Edit project title">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 20h4l10-10a2.5 2.5 0 0 0-4-4L4 16v4z"></path>
              <path d="M13.5 6.5l4 4"></path>
            </svg>
          </button>
        </div>
      </header>

      <main class="dashboard">
        <div id="job-status-message" hidden></div>
        <div class="hidden-controls" hidden>
          <select id="question-type">
            <option value="객관식" selected>&#44061;&#44288;&#49885;</option>
            <option value="단답형">&#45800;&#45813;&#54805;</option>
            <option value="서술형">&#49436;&#49696;&#54805;</option>
          </select>
          <input type="hidden" id="question-count" value="5">
        </div>

        <section class="panel workspace-panel">
          <div class="panel-heading panel-row prompt-heading">
            <div>
              <h2>문제 생성 요청</h2>
            </div>
          </div>
          <div class="field-grid">
            <label class="textarea-wrap field-span-2">
              <textarea id="prompt-input" placeholder="예: 운영체제 교착상태 개념 위주로 객관식 5문항과 서술형 2문항을 생성해줘."></textarea>
            </label>
          </div>

          <div class="controls">
            <button type="button" id="sample-button" class="ghost-button">예시 질문 생성</button>
            <button type="button" id="quiz-settings-toggle" class="ghost-button" aria-haspopup="dialog" aria-controls="quiz-settings-panel">
              &#53300;&#51592; &#49373;&#49457;
            </button>
            <a class="ghost-button explanation-inline-link" href="./explanation.html">&#54644;&#49444;</a>
            <button type="button" id="generate-button" class="primary-button">&#49892;&#54665;</button>
            <button type="button" id="reset-button" class="ghost-button">&#52488;&#44592;&#54868;</button>
          </div>

          <div class="workspace-result-header panel-heading panel-row result-heading">
            <div>
              <h2>&#49373;&#49457;&#46108; &#47928;&#51228;</h2>
            </div>
          </div>
          <div id="result-cards" class="result-cards">
            <article class="result-card result-card-empty">
              <p>&#49373;&#49457;&#46108; &#53300;&#51592;&#44032; &#50630;&#49845;&#45768;&#45796;.</p>
            </article>
          </div>
        </section>
      </main>
    </div>

  </div>


  <div id="quiz-settings-modal" class="settings-modal" hidden>
    <div class="settings-backdrop" data-close-settings></div>
    <section id="quiz-settings-panel" class="panel settings-panel settings-dialog" role="dialog" aria-modal="true" aria-labelledby="quiz-settings-title">
      <div class="panel-heading panel-row">
        <div>
          <p class="panel-kicker">Settings</p>
          <h2 id="quiz-settings-title">&#49373;&#49457; &#49444;&#51221;</h2>
        </div>
        <button type="button" class="settings-close" data-close-settings aria-label="Close">x</button>
      </div>

      <div class="setting-group">
        <p>&#47928;&#51228; &#50976;&#54805;</p>
        <div class="setting-options" role="group" aria-label="Question type">
          <button type="button" class="setting-button is-active" data-setting-target="question-type" data-setting-value="객관식">&#44061;&#44288;&#49885;</button>
          <button type="button" class="setting-button" data-setting-target="question-type" data-setting-value="단답형">&#45800;&#45813;&#54805;</button>
          <button type="button" class="setting-button" data-setting-target="question-type" data-setting-value="서술형">&#49436;&#49696;&#54805;</button>
        </div>
      </div>

      <div class="setting-group">
        <p>&#47928;&#51228; &#49688;</p>
        <div class="setting-options" role="group" aria-label="Question count">
          <button type="button" class="setting-button" data-setting-target="question-count" data-setting-value="3">3&#47928;&#54637;</button>
          <button type="button" class="setting-button is-active" data-setting-target="question-count" data-setting-value="5">5&#47928;&#54637;</button>
          <button type="button" class="setting-button" data-setting-target="question-count" data-setting-value="10">10&#47928;&#54637;</button>
        </div>
        <label class="custom-count-field">
          <span>&#51649;&#51217; &#51077;&#47141;</span>
          <input type="number" id="custom-question-count" min="1" max="50" step="1" value="5" inputmode="numeric" aria-label="Custom question count">
        </label>
      </div>

      <div class="settings-actions">
        <button type="button" id="quiz-settings-confirm" class="primary-button settings-confirm">&#51201;&#50857;</button>
      </div>
    </section>
  </div>

  <script src="./src/main.js" defer></script>
</body>
</html>
