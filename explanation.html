<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SNOW explanation workspace.">
  <title>SNOW Explanation</title>
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
  <nav class="global-nav" aria-label="Global">
    <div class="nav-brand-group">
      <a class="nav-brand" href="./index.html">SNOW</a>
      <span class="nav-tagline">
        <strong>S</strong>mart <strong>N</strong>ote <strong>O</strong>rganizer for <strong>W</strong>eb
      </span>
    </div>
    <div class="nav-links">
      <a href="./index.html">Workspace</a>
      <a id="login-link" href="./login.html">Login</a>
      <button type="button" id="logout-button" class="nav-button" hidden>Logout</button>
    </div>
  </nav>

    <div class="screen-layout app-surface explanation-layout">
    <aside class="screen-side screen-side-left">
      <div class="left-layout">
        <div class="left-rail">
          <button type="button" id="left-menu-toggle" class="left-menu-toggle" aria-expanded="false" aria-controls="left-menu-drawer">
            <span class="sr-only">Menu</span>
            <strong aria-hidden="true">&#9776;</strong>
          </button>
        </div>

        <div id="left-menu-drawer" class="left-menu-drawer explanation-left-drawer" aria-hidden="true">
          <div class="left-history-slot">
            <article class="panel explanation-panel explanation-references-panel">
              <div class="panel-heading">
                <h2>참고 섹션</h2>
              </div>
              <label class="select-wrap explanation-notebook-picker">
                <span>Notebook 선택</span>
                <select id="explanation-notebook-select"></select>
              </label>
              <div id="explanation-references" class="explanation-placeholder">Notebook을 선택하면 업로드 문서와 참고 정보가 표시됩니다.</div>
            </article>

            <article class="panel explanation-panel explanation-qa-panel">
              <div class="panel-heading">
                <h2>Q&A 기록</h2>
              </div>
              <div id="notebook-qa-history" class="explanation-placeholder">Notebook Q&A 기록이 표시됩니다.</div>

            </article>
          </div>
        </div>
      </div>
    </aside>

    <main class="explanation-shell page-shell">
      <section class="explanation-board">
        <article class="panel explanation-panel document-summary-panel">
          <div class="panel-heading">
            <h2>문서 요약</h2>
          </div>
          <div id="document-summary" class="explanation-placeholder">Notebook을 선택하면 문서 요약이 표시됩니다.</div>
          <button type="button" class="scroll-expand-button" data-scroll-toggle="document-summary" aria-expanded="false" aria-label="문서 요약 전체 보기" title="전체 보기"></button>
        </article>

        <article class="panel explanation-panel generated-questions-panel">
          <div class="panel-heading">
            <h2>생성된 문제</h2>
          </div>
          <div id="explanation-question" class="explanation-placeholder">선택한 Notebook의 생성 문제가 표시됩니다.</div>
        </article>

        <article class="panel explanation-panel explanation-panel-featured">
          <div class="panel-heading">
            <h2>정답 및 해설</h2>
          </div>
          <div id="explanation-answer" class="explanation-placeholder">생성된 문제의 정답과 해설이 표시됩니다.</div>
        </article>

        <button type="button" class="scroll-expand-button paired-scroll-expand-button" data-scroll-toggle="explanation-question explanation-answer" aria-expanded="false" aria-label="문제와 정답 및 해설 전체 보기" title="전체 보기"></button>

        <article class="panel explanation-panel notebook-qa-prompt-panel">
          <div class="panel-heading">
            <h2>SNOW에게 질문</h2>
          </div>
          <form id="notebook-qa-form" class="notebook-qa-form notebook-qa-form-inline">
            <label class="select-wrap">
              <span>질문 입력</span>
              <input id="notebook-qa-input" type="text" placeholder="Notebook 내용에 대해 질문하세요">
            </label>
            <button type="submit" id="notebook-qa-submit" class="primary-button qa-submit-button" aria-label="질문 보내기" title="질문 보내기">&#8593;</button>
          </form>
        </article>
      </section>
    </main>
  </div>

  <script src="./src/explanation.js" defer></script>
</body>
</html>
